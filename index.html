<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asignación de Consultorios</title>
  <style>
    :root {
      --primary-color: #0f766e;
      --primary-hover: #0d9488;
      --bg-color: #f0fdf4;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --border-color: #cbd5e1;
      --danger-color: #ef4444;
      --warning-color: #f59e0b;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    h2 {
      color: var(--primary-color);
      margin-top: 0;
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 10px;
      text-align: center;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-weight: 600;
      margin-bottom: 5px;
      font-size: 0.9rem;
    }

    input, select {
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--primary-color);
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-save {
      background-color: var(--primary-color);
      color: white;
    }

    .btn-save:hover {
      background-color: var(--primary-hover);
    }

    .btn-cancel {
      background-color: #94a3b8;
      color: white;
      display: none;
    }

    .btn-cancel:hover {
      background-color: #64748b;
    }

    /* Tabla de registros */
    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background-color: #f1f5f9;
      color: var(--primary-color);
      font-weight: 700;
    }

    tr:hover {
      background-color: #f8fafc;
    }

    .action-btn {
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 0.85rem;
      cursor: pointer;
      border: none;
      margin-right: 5px;
    }

    .btn-edit {
      background-color: var(--warning-color);
      color: white;
    }

    .btn-delete {
      background-color: var(--danger-color);
      color: white;
    }

    .status-msg {
      text-align: center;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 6px;
      display: none;
      font-weight: 600;
    }

    .status-loading {
      background-color: #e0f2fe;
      color: #0369a1;
    }

    .status-success {
      background-color: #dcfce7;
      color: #15803d;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Asignación de Consultorios (Hoja TOPE)</h2>

    <div id="statusMsg" class="status-msg"></div>

    <!-- Formulario de Entrada -->
    <form id="topeForm">
      <input type="hidden" id="rowIndex" value=""> <!-- Guarda la fila cuando se edita -->

      <div class="form-grid">
        <div class="form-group">
          <label for="fecha">Fecha:</label>
          <input type="date" id="fecha" required>
        </div>

        <div class="form-group">
          <label for="consultorio">Consultorio:</label>
          <select id="consultorio" required>
            <option value="">Cargando consultorios...</option>
          </select>
        </div>

        <div class="form-group">
          <label for="turno">Turno:</label>
          <select id="turno" required>
            <option value="MAÑANA">MAÑANA</option>
            <option value="TARDE">TARDE</option>
            <option value="NOCHE">NOCHE</option>
          </select>
        </div>

        <div class="form-group">
          <label for="cantidad">Cantidad (Tope):</label>
          <input type="number" id="cantidad" min="1" required placeholder="Ej. 12">
        </div>
      </div>

      <div class="btn-group">
        <button type="submit" id="btnGuardar" class="btn-save">Guardar Asignación</button>
        <button type="button" id="btnCancelar" class="btn-cancel" onclick="limpiarFormulario()">Cancelar Edición</button>
      </div>
    </form>

    <!-- Tabla para mostrar y administrar los registros -->
    <h3>Registros Existentes</h3>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Consultorio</th>
            <th>Turno</th>
            <th>Cantidad</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaCuerpo">
          <tr>
            <td colspan="5" style="text-align: center;">Cargando datos...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // =========================================================================
    // URL DEL GOOGLE APPS SCRIPT ADMINISTRATIVO
    // =========================================================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzGHN6XKIcWZqMRFMlfAUaaj87-qowqBPBv4sOSffQK8h1X9_LP2ta2gwNRWTU2fRMF/exec";

    document.addEventListener("DOMContentLoaded", () => {
      cargarConsultorios();
      cargarTablaTope();
    });

    const form = document.getElementById("topeForm");
    const statusMsg = document.getElementById("statusMsg");

    // Mostrar mensaje de estado
    function mostrarMensaje(texto, tipo = "loading") {
      statusMsg.innerText = texto;
      statusMsg.className = `status-msg status-${tipo}`;
      statusMsg.style.display = "block";
    }

    function ocultarMensaje() {
      statusMsg.style.display = "none";
    }

    // 1. Cargar lista de consultorios desde la hoja "ADMIN" (Columna C)
    function cargarConsultorios() {
      fetch(`${SCRIPT_URL}?action=getConsultorios`)
        .then(res => res.json())
        .then(data => {
          const select = document.getElementById("consultorio");
          select.innerHTML = '<option value="">Seleccione un consultorio...</option>';
          data.forEach(item => {
            if (item) {
              const option = document.createElement("option");
              option.value = item;
              option.textContent = item;
              select.appendChild(option);
            }
          });
        })
        .catch(err => {
          console.error("Error al obtener consultorios:", err);
          document.getElementById("consultorio").innerHTML = '<option value="">Error al cargar</option>';
        });
    }

    // 2. Cargar tabla con registros de la hoja "TOPE"
    function cargarTablaTope() {
      fetch(`${SCRIPT_URL}?action=getDataTope`)
        .then(res => res.json())
        .then(data => {
          const tbody = document.getElementById("tablaCuerpo");
          tbody.innerHTML = "";

          if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">No hay registros cargados.</td></tr>';
            return;
          }

          data.forEach((row, index) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td>${row.fecha}</td>
              <td>${row.consultorio}</td>
              <td>${row.turno}</td>
              <td>${row.cantidad}</td>
              <td>
                <button class="action-btn btn-edit" onclick="prepararEdicion(${row.rowIndex}, '${row.fecha}', '${row.consultorio}', '${row.turno}', ${row.cantidad})">Editar</button>
                <button class="action-btn btn-delete" onclick="eliminarRegistro(${row.rowIndex})">Eliminar</button>
              </td>
            `;
            tbody.appendChild(tr);
          });
        })
        .catch(err => console.error("Error al cargar la tabla:", err));
    }

    // 3. Guardar o Editar Registro
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      
      const rowIndex = document.getElementById("rowIndex").value;
      const payload = {
        action: rowIndex ? "update" : "create",
        rowIndex: rowIndex,
        fecha: document.getElementById("fecha").value,
        consultorio: document.getElementById("consultorio").value,
        turno: document.getElementById("turno").value,
        cantidad: document.getElementById("cantidad").value
      };

      mostrarMensaje("Procesando solicitud...", "loading");

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        mostrarMensaje("¡Operación completada con éxito!", "success");
        limpiarFormulario();
        setTimeout(() => {
          ocultarMensaje();
          cargarTablaTope();
        }, 1500);
      })
      .catch(err => {
        mostrarMensaje("Ocurrió un error al guardar.", "danger");
        console.error(err);
      });
    });

    // 4. Cargar datos en el formulario para Editar
    function prepararEdicion(rowIndex, fecha, consultorio, turno, cantidad) {
      document.getElementById("rowIndex").value = rowIndex;
      document.getElementById("fecha").value = formatearFechaParaInput(fecha);
      document.getElementById("consultorio").value = consultorio;
      document.getElementById("turno").value = turno;
      document.getElementById("cantidad").value = cantidad;

      document.getElementById("btnGuardar").textContent = "Actualizar Asignación";
      document.getElementById("btnCancelar").style.display = "inline-block";
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 5. Eliminar Registro
    function eliminarRegistro(rowIndex) {
      if (!confirm("¿Está seguro de que desea eliminar este registro?")) return;

      mostrarMensaje("Eliminando registro...", "loading");

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "delete", rowIndex: rowIndex })
      })
      .then(() => {
        mostrarMensaje("Registro eliminado correctamente.", "success");
        setTimeout(() => {
          ocultarMensaje();
          cargarTablaTope();
        }, 1500);
      })
      .catch(err => console.error("Error al eliminar:", err));
    }

    // Funciones auxiliares
    function limpiarFormulario() {
      form.reset();
      document.getElementById("rowIndex").value = "";
      document.getElementById("btnGuardar").textContent = "Guardar Asignación";
      document.getElementById("btnCancelar").style.display = "none";
    }

    function formatearFechaParaInput(fechaTexto) {
      // Convierte dd/mm/yyyy a yyyy-mm-dd para el input date
      const partes = fechaTexto.split('/');
      if (partes.length === 3) {
        return `${partes[2]}-${partes[1].padStart(2, '0')}-${partes[0].padStart(2, '0')}`;
      }
      return fechaTexto;
    }
  </script>
</body>
</html>
