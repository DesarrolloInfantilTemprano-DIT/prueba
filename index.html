<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIGIS_FED - Mapa Georreferenciado</title>
  
  <!-- Tailwind CSS & Lucide Icons -->

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet Draw (Trazar líneas / Polígonos de búsqueda) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

  <style>
    #map { height: calc(100vh - 60px); width: 100%; z-index: 1; }
    .loader {
      border-top-color: #2563eb;
      animation: spinner 0.6s linear infinite;
    }
    @keyframes spinner {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .custom-popup .leaflet-popup-content-wrapper {
      padding: 0;
      border-radius: 12px;
      overflow: hidden;
    }
    .custom-popup .leaflet-popup-content {
      margin: 0;
      width: 280px !important;
    }
    .draw-tooltip {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #3b82f6;
      color: #ffffff;
      font-weight: 700;
      font-size: 11px;
      border-radius: 6px;
      padding: 4px 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }
    .draw-tooltip::before {
      border-top-color: rgba(15, 23, 42, 0.9);
    }
  </style>
</head>

    <div class="flex items-center space-x-2 md:space-x-3 truncate">
      <button onclick="togglePanelFiltros()" title="Mostrar/Ocultar Filtros" class="p-1.5 bg-blue-700 hover:bg-blue-600 rounded-lg transition text-white flex items-center justify-center shrink-0">
        <i data-lucide="filter" id="iconTogglePanel" class="w-5 h-5 text-emerald-400"></i>
      </button>
      <i data-lucide="map-pin" class="w-5 h-5 text-emerald-400 hidden sm:block shrink-0"></i>
      <div class="truncate">
        <h1 class="text-xs sm:text-base font-bold leading-tight truncate">SIGIS_FED - Georreferenciación</h1>

    </div>
    <div class="flex items-center gap-2 shrink-0">

      <button onclick="cargarBaseDatos()" title="Recargar Datos" class="p-1.5 bg-blue-700 hover:bg-blue-600 rounded-lg transition text-white">

    </div>
  </header>

  <!-- PANEL PRINCIPAL CONTENEDOR (FILTROS + MAPA) -->

    <!-- OVERLAY CAPA OSCURA MÓVIL AL ABRIR FILTROS -->

    <!-- BOTÓN FLOTANTE PARA REABRIR PANEL CUANDO ESTÁ OCULTO -->
    <button id="btnAbrirPanelFlotante" onclick="togglePanelFiltros()" class="hidden absolute top-3 left-3 z-30 bg-blue-800 text-white p-2 rounded-lg shadow-xl hover:bg-blue-700 transition flex items-center gap-1.5 text-xs font-bold border border-blue-600">

    <!-- PANEL LATERAL DE FILTROS Y ESTADÍSTICAS -->

          <i data-lucide="filter" class="w-4 h-4 text-blue-600"></i> Filtros de Búsqueda
        </h2>
        <div class="flex items-center gap-2">

      </div>

      <!-- FILTRO SECTOR (MÚLTIPLE) -->

        <label for="f_sector" class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Sector(es) Múltiple</label>

        </div>
        <div>
          <span class="text-[10px] text-slate-500 font-semibold block mb-0.5">Hasta:</span>
          <input type="date" id="f_fn_hasta" onchange="actualizarInfoEdad(); aplicarFiltros();"

        <div id="badgeEdadEquivalente" class="hidden mt-1.5 p-1.5 bg-blue-600 text-white text-[10px] rounded font-bold text-center flex items-center justify-center gap-1 shadow-sm">
          <i data-lucide="user-check" class="w-3 h-3"></i>
          <span id="textoEdadEquivalente">Rango: -</span>
        </div>
      </div>

      <!-- PANEL DE ESTADÍSTICAS INTERACTIVO POR GRUPO ETARIO -->
      <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 space-y-2 pb-6 md:pb-3">
        <h3 class="text-xs font-bold text-slate-800 uppercase border-b pb-1 flex items-center justify-between">
          <span>Estadística Demográfica</span>
          <span id="stat_total" class="text-blue-700 font-extrabold text-[11px]">0 pers.</span>
        </h3>
        <p class="text-[10px] text-slate-500 font-medium">Haz clic en un grupo para ubicarlo en el mapa:</p>
        <div class="grid grid-cols-2 gap-1.5 text-[11px]">
          <button id="btn_etario_ninos" onclick="toggleFiltroEtario('ninos')" class="bg-emerald-50 border border-emerald-300 p-1.5 rounded flex justify-between items-center hover:bg-emerald-100 transition text-left cursor-pointer">
            <span class="text-emerald-800 font-bold">Niños (&lt;12)</span>
            <span id="stat_ninos" class="font-extrabold text-emerald-900">0</span>
          </button>
          <button id="btn_etario_adolescentes" onclick="toggleFiltroEtario('adolescentes')" class="bg-teal-50 border border-teal-300 p-1.5 rounded flex justify-between items-center hover:bg-teal-100 transition text-left cursor-pointer">
            <span class="text-teal-800 font-bold">Adolesc. (12-17)</span>
            <span id="stat_adolescentes" class="font-extrabold text-teal-900">0</span>
          </button>
          <button id="btn_etario_jovenes" onclick="toggleFiltroEtario('jovenes')" class="bg-blue-50 border border-blue-300 p-1.5 rounded flex justify-between items-center hover:bg-blue-100 transition text-left cursor-pointer">
            <span class="text-blue-800 font-bold">Jóvenes (18-29)</span>
            <span id="stat_jovenes" class="font-extrabold text-blue-900">0</span>
          </button>
          <button id="btn_etario_adultos" onclick="toggleFiltroEtario('adultos')" class="bg-indigo-50 border border-indigo-300 p-1.5 rounded flex justify-between items-center hover:bg-indigo-100 transition text-left cursor-pointer">

          <button id="btn_etario_ancianos" onclick="toggleFiltroEtario('ancianos')" class="bg-purple-50 border border-purple-300 p-1.5 rounded flex justify-between items-center hover:bg-purple-100 transition text-left cursor-pointer col-span-2">
            <span class="text-purple-800 font-bold">Ancianos (60+)</span>

    <!-- MAPA LEAFLET -->

  <!-- MODAL DE SELECCIÓN DE SECTORES MÚLTIPLES -->
  <div id="modalSector" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-md rounded-xl shadow-2xl overflow-hidden flex flex-col max-h-[85vh]">
      <div class="bg-blue-700 text-white p-3.5 flex justify-between items-center">
        <div class="flex items-center gap-2">
          <i data-lucide="map-pin" class="w-5 h-5"></i>
          <h3 class="font-bold text-sm">Seleccionar Sectores Registrados</h3>
        </div>
        <button onclick="cerrarModalSector()" class="hover:bg-blue-800 p-1 rounded transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="p-3 border-b bg-slate-50 flex gap-2">
        <input type="text" id="searchSectorInput" placeholder="ESCRIBA PARA BUSCAR SECTOR..." oninput="filtrarListaSectores()"
          class="flex-1 px-3 py-2 border border-blue-400 rounded-lg text-xs uppercase font-semibold focus:ring-2 focus:ring-blue-500 outline-none">
        <button onclick="marcarTodosSectores(true)" class="px-2.5 py-1.5 bg-blue-100 text-blue-800 text-[10px] font-bold rounded hover:bg-blue-200">
          MARCAR
        </button>
        <button onclick="marcarTodosSectores(false)" class="px-2.5 py-1.5 bg-slate-200 text-slate-700 text-[10px] font-bold rounded hover:bg-slate-300">
          DESMARCAR
        </button>
      </div>
      <div id="contenedorListaSectores" class="p-2 overflow-y-auto flex-1 divide-y divide-slate-100 space-y-1">
        <!-- Checkboxes generados por JS -->
      </div>
      <div class="p-3 bg-slate-100 border-t flex justify-end gap-2">
        <button onclick="seleccionarSectorTodos()" class="px-3 py-1.5 bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg hover:bg-slate-300">
          TODOS
        </button>
        <button onclick="confirmarSectoresSeleccionados()" class="px-4 py-1.5 bg-blue-600 text-white text-xs font-bold rounded-lg hover:bg-blue-700 shadow">
          ACEPTAR
        </button>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    const URL_CENSO = "https://script.google.com/macros/s/AKfycbz-PaNW15W43wBS8AmlEHfFe4QrUnITK-8yEnvwoGUnpw7PdbpNvJhPCc4q5qDs8c3WWg/exec";
    let baseDatos = [];
    let map = null;
    let markersLayer = L.layerGroup();
    let drawnItems = new L.FeatureGroup();
    let sectoresSeleccionados = new Set();
    let filtroEtarioActivo = null;

    function togglePanelFiltros() {
      const panel = document.getElementById('panelFiltros');
      const btnFlotante = document.getElementById('btnAbrirPanelFlotante');
      const overlay = document.getElementById('overlayMobile');

      if (panel.classList.contains('hidden')) {
        panel.classList.remove('hidden');
        if (overlay) overlay.classList.remove('hidden');
        btnFlotante.classList.add('hidden');
      } else {
        panel.classList.add('hidden');
        if (overlay) overlay.classList.add('hidden');
        btnFlotante.classList.remove('hidden');
      }
      lucide.createIcons();
      setTimeout(() => { if (map) map.invalidateSize(); }, 300);
    }

    // Inicializar Modal de Sectores con Checkboxes
    function initModalSectores() {
      const datalist = document.getElementById('listaSectores');
      const opciones = Array.from(datalist.options).map(opt => opt.value);
      renderSectoresModal(opciones);
    }

    function renderSectoresModal(lista) {
      const cont = document.getElementById('contenedorListaSectores');
      cont.innerHTML = "";
      if (lista.length === 0) {
        cont.innerHTML = `<div class="p-4 text-center text-xs text-slate-500 font-semibold">No se encontraron sectores</div>`;
        return;
      }
      lista.forEach(sec => {
        const isChecked = sectoresSeleccionados.has(sec);
        const label = document.createElement('label');
        label.className = "flex items-center gap-3 p-2 hover:bg-blue-50 cursor-pointer rounded transition text-xs font-bold text-slate-700 uppercase";
        label.innerHTML = `
          <input type="checkbox" value="${sec}" ${isChecked ? 'checked' : ''} onchange="toggleSectorCheckbox('${sec}', this.checked)" class="w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500">
          <span class="flex-1">${sec}</span>
        `;
        cont.appendChild(label);
      });
    }

    function toggleSectorCheckbox(sec, checked) {
      if (checked) {
        sectoresSeleccionados.add(sec);
      } else {
        sectoresSeleccionados.delete(sec);
      }
    }

    function marcarTodosSectores(estado) {
      const datalist = document.getElementById('listaSectores');
      const opciones = Array.from(datalist.options).map(opt => opt.value);
      if (estado) {
        opciones.forEach(sec => sectoresSeleccionados.add(sec));
      } else {
        sectoresSeleccionados.clear();
      }
      filtrarListaSectores();
    }

    function filtrarListaSectores() {
      const q = document.getElementById('searchSectorInput').value.trim().toLowerCase();
      const datalist = document.getElementById('listaSectores');
      const opciones = Array.from(datalist.options).map(opt => opt.value);
      const filtradas = opciones.filter(opt => opt.toLowerCase().includes(q));
      renderSectoresModal(filtradas);
    }

    function abrirModalSector() {
      document.getElementById('modalSector').classList.remove('hidden');
      document.getElementById('searchSectorInput').value = "";
      filtrarListaSectores();
      document.getElementById('searchSectorInput').focus();
    }

    function cerrarModalSector() {
      document.getElementById('modalSector').classList.add('hidden');
    }

    function seleccionarSectorTodos() {
      sectoresSeleccionados.clear();
      document.getElementById('f_sector').value = "";
      cerrarModalSector();
      aplicarFiltros();
    }

    function confirmarSectoresSeleccionados() {
      const arraySectores = Array.from(sectoresSeleccionados);
      if (arraySectores.length === 0) {
        document.getElementById('f_sector').value = "";
      } else {
        document.getElementById('f_sector').value = arraySectores.join(', ');
      }
      cerrarModalSector();
      aplicarFiltros();
    }

    // Filtro por Grupo Etario al presionar tarjetas de estadística
    function toggleFiltroEtario(grupo) {
      const botones = ['ninos', 'adolescentes', 'jovenes', 'adultos', 'ancianos'];
      
      if (filtroEtarioActivo === grupo) {
        filtroEtarioActivo = null;
      } else {
        filtroEtarioActivo = grupo;
      }

      botones.forEach(b => {
        const btn = document.getElementById(`btn_etario_${b}`);
        if (b === filtroEtarioActivo) {
          btn.classList.add('ring-2', 'ring-blue-600', 'shadow-md', 'scale-[1.02]');
        } else {
          btn.classList.remove('ring-2', 'ring-blue-600', 'shadow-md', 'scale-[1.02]');
        }
      });

      aplicarFiltros();
    }

    // Inicializar Mapa
    function initMap() {
      map = L.map('map').setView([-9.288639, -76.008830], 14);

      const googleHybrid = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
        maxZoom: 20,
        subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
        attribution: '&copy; Google Maps'
      });

      const callejero = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      });

      googleHybrid.addTo(map);

      const baseMaps = {
        "Satelital HD (Google Earth)": googleHybrid,
        "Callejero": callejero
      };

      L.control.layers(baseMaps).addTo(map);
      markersLayer.addTo(map);
      map.addLayer(drawnItems);

      const drawControl = new L.Control.Draw({
        draw: {
          polygon: true,
          rectangle: true,
          circle: true,
          polyline: false,
          marker: false,
          circlemarker: false
        },
        edit: {
          featureGroup: drawnItems,
          remove: true
        }
      });
      map.addControl(drawControl);

      map.on(L.Draw.Event.CREATED, function (e) {
        drawnItems.clearLayers();
        drawnItems.addLayer(e.layer);
        aplicarFiltros();
      });

      map.on(L.Draw.Event.EDITED, function () {
        aplicarFiltros();
      });

      map.on(L.Draw.Event.DELETED, function () {
        aplicarFiltros();
      });

      // En dispositivos móviles inicia con el panel cerrado para dar visibilidad al mapa
      if (window.innerWidth < 768) {
        document.getElementById('panelFiltros').classList.add('hidden');
        document.getElementById('btnAbrirPanelFlotante').classList.remove('hidden');
      }

      initModalSectores();
      cargarBaseDatos();
    }

    async function cargarBaseDatos() {
      document.getElementById('badgeConteo').textContent = "Cargando...";
      try {
        const response = await fetch(`${URL_CENSO}?action=obtenerTodosMapas`);
        const result = await response.json();

        if (result && result.status === "ok") {
          baseDatos = result.data || [];
          aplicarFiltros();
        } else {
          document.getElementById('badgeConteo').textContent = "0 Registros";
        }
      } catch (error) {
        console.error("Error al cargar mapa:", error);
        document.getElementById('badgeConteo').textContent = "Error de conexión";
      }
    }

    function parseFechaPeruana(strFecha) {
      if (!strFecha) return null;
      if (strFecha.includes('-')) {
        const partes = strFecha.split('-');
        if (partes[0].length === 4) return new Date(strFecha);
      }
      const partes = strFecha.split('/');
      if (partes.length === 3) {
        return new Date(partes[2], partes[1] - 1, partes[0]);
      }
      return null;
    }

    function calcularEdad(strFecha) {
      const fn = parseFechaPeruana(strFecha);
      if (!fn || isNaN(fn.getTime())) return null;
      const hoy = new Date();
      let edad = hoy.getFullYear() - fn.getFullYear();
      const m = hoy.getMonth() - fn.getMonth();
      if (m < 0 || (m === 0 && hoy.getDate() < fn.getDate())) {
        edad--;
      }
      return edad;
    }

    function obtenerTextoEdadDetallada(strFecha) {
      const edad = calcularEdad(strFecha);
      if (edad === null) return 'S/I';
      
      if (edad === 0) {
        const fn = parseFechaPeruana(strFecha);
        const hoy = new Date();
        let meses = (hoy.getFullYear() - fn.getFullYear()) * 12 + (hoy.getMonth() - fn.getMonth());
        if (hoy.getDate() < fn.getDate()) {
          meses--;
        }
        if (meses < 0) meses = 0;
        return `0 años ( ${meses} meses )`;
      }
      
      return `${edad} años`;
    }

    function actualizarInfoEdad() {
      const fnDesdeStr = document.getElementById('f_fn_desde').value;
      const fnHastaStr = document.getElementById('f_fn_hasta').value;
      const badge = document.getElementById('badgeEdadEquivalente');
      const texto = document.getElementById('textoEdadEquivalente');

      if (!fnDesdeStr && !fnHastaStr) {
        badge.classList.add('hidden');
        return;
      }

      let edadMin = null;
      let edadMax = null;

      if (fnHastaStr) edadMin = calcularEdad(fnHastaStr);
      if (fnDesdeStr) edadMax = calcularEdad(fnDesdeStr);

      badge.classList.remove('hidden');

      if (edadMin !== null && edadMax !== null) {
        if (edadMin > edadMax) {
          const temp = edadMin; edadMin = edadMax; edadMax = temp;
        }
        texto.textContent = `Edades filtradas: ${edadMin} a ${edadMax} años`;
      } else if (edadMin !== null) {
        texto.textContent = `Edades filtradas: Desde ${edadMin} años`;
      } else if (edadMax !== null) {
        texto.textContent = `Edades filtradas: Hasta ${edadMax} años`;
      }
      lucide.createIcons();
    }

    function normalizarMz(mzStr) {
      if (!mzStr) return "";
      return mzStr.toString().toLowerCase().replace(/mz|\.|\s/g, '').trim();
    }

    // Filtrar y Renderizar los marcadores
    function aplicarFiltros() {
      const ffamiliar = document.getElementById('f_ffamiliar').value.trim().toLowerCase();
      
      const arraySectoresInput = Array.from(sectoresSeleccionados).map(s => s.toLowerCase());

      const mzInputRaw = document.getElementById('f_mz').value.trim();
      const arrayMzInput = mzInputRaw ? mzInputRaw.split(',').map(m => normalizarMz(m)).filter(m => m !== "") : [];

      const dni = document.getElementById('f_dni').value.trim().toLowerCase();
      const nombre = document.getElementById('f_nombre').value.trim().toLowerCase();

      const fnDesdeStr = document.getElementById('f_fn_desde').value;
      const fnHastaStr = document.getElementById('f_fn_hasta').value;

      const dateDesde = fnDesdeStr ? new Date(fnDesdeStr) : null;
      const dateHasta = fnHastaStr ? new Date(fnHastaStr) : null;

      markersLayer.clearLayers();

      const filtrados = baseDatos.filter(item => {
        if (ffamiliar && (!item.ffamiliar || !item.ffamiliar.toString().toLowerCase().includes(ffamiliar))) return false;
        
        if (arraySectoresInput.length > 0) {
          if (!item.sector) return false;
          const itemSector = item.sector.toString().toLowerCase();
          const coincideSector = arraySectoresInput.some(sec => itemSector.includes(sec));
          if (!coincideSector) return false;
        }

        if (arrayMzInput.length > 0) {
          const itemMz = normalizarMz(item.mz);
          const coincideMz = arrayMzInput.some(m => itemMz === m);
          if (!coincideMz) return false;
        }

        if (dni && (!item.dni || !item.dni.toString().toLowerCase().includes(dni))) return false;
        if (nombre && (!item.nombreB || !item.nombreB.toString().toLowerCase().includes(nombre))) return false;

        if (dateDesde || dateHasta) {
          const fnFecha = parseFechaPeruana(item.fn);
          if (!fnFecha) return false;
          if (dateDesde && fnFecha < dateDesde) return false;
          if (dateHasta && fnFecha > dateHasta) return false;
        }

        if (filtroEtarioActivo) {
          const edad = calcularEdad(item.fn);
          if (edad === null) return false;
          if (filtroEtarioActivo === 'ninos' && edad >= 12) return false;
          if (filtroEtarioActivo === 'adolescentes' && (edad < 12 || edad > 17)) return false;
          if (filtroEtarioActivo === 'jovenes' && (edad < 18 || edad > 29)) return false;
          if (filtroEtarioActivo === 'adultos' && (edad < 30 || edad > 59)) return false;
          if (filtroEtarioActivo === 'ancianos' && edad < 60) return false;
        }

        return true;
      });

      actualizarEstadisticas(filtrados);

      const gruposCoordenadas = {};

      filtrados.forEach((item) => {
        if (!item.georeferencia) return;
        const strGeoref = item.georeferencia.toString().replace(/;/g, ',').replace(/\s+/g, '');
        const coords = strGeoref.split(',');
        if (coords.length >= 2) {
          const lat = parseFloat(coords[0].replace(',', '.'));
          const lng = parseFloat(coords[1].replace(',', '.'));

          if (!isNaN(lat) && !isNaN(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) {
            const key = `${lat.toFixed(6)},${lng.toFixed(6)}`;
            if (!gruposCoordenadas[key]) {
              gruposCoordenadas[key] = { lat, lng, ffamiliar: item.ffamiliar, integrantes: [] };
            }
            gruposCoordenadas[key].integrantes.push(item);
          }
        }
      });

      const bounds = [];
      let totalPersonasEnFigura = 0;
      let totalPuntosEnFigura = 0;

      Object.values(gruposCoordenadas).forEach(grupo => {
        if (drawnItems.getLayers().length > 0) {
          let dentro = false;
          const pt = L.latLng(grupo.lat, grupo.lng);
          drawnItems.eachLayer(layer => {
            if (layer instanceof L.Circle) {
              if (layer.getLatLng().distanceTo(pt) <= layer.getRadius()) dentro = true;
            } else if (layer instanceof L.Polygon || layer instanceof L.Rectangle) {
              if (layer.getBounds().contains(pt)) dentro = true;
            }
          });
          if (!dentro) return;
        }

        totalPuntosEnFigura++;
        totalPersonasEnFigura += grupo.integrantes.length;
        bounds.push([grupo.lat, grupo.lng]);

        let countNinos = 0, countAdolescentes = 0, countJovenes = 0, countAdultos = 0, countAncianos = 0;

        grupo.integrantes.forEach(ing => {
          const edad = calcularEdad(ing.fn);
          if (edad !== null) {
            if (edad < 12) countNinos++;
            else if (edad <= 17) countAdolescentes++;
            else if (edad <= 29) countJovenes++;
            else if (edad <= 59) countAdultos++;
            else countAncianos++;
          }
        });

        let popupContent = `
          <div class="custom-popup font-sans text-xs">
            <div class="bg-blue-800 text-white p-2.5 flex justify-between items-center">
              <div>
                <span class="text-[10px] uppercase text-blue-200 block font-bold">Ficha Familiar</span>
                <span class="font-bold text-sm">${grupo.ffamiliar || 'S/N'}</span>
              </div>
              <span class="text-[10px] bg-emerald-500 text-slate-900 font-extrabold px-2 py-0.5 rounded-full">${grupo.integrantes.length} Integrante(s)</span>
            </div>

            <div class="p-2 bg-slate-100 border-b border-slate-200 text-[10px] text-slate-700">
              <p><strong>Sector:</strong> ${grupo.integrantes[0].sector || '-'}</p>
              <p><strong>Ref / Mz:</strong> ${grupo.integrantes[0].ref_direccion || '-'} (Mz ${grupo.integrantes[0].mz || '-'})</p>
            </div>

            <div class="p-2 bg-blue-50 border-b border-blue-100 text-[10px] grid grid-cols-3 gap-1 text-center font-bold">
              <span class="text-emerald-700">Niños: ${countNinos}</span>
              <span class="text-teal-700">Adol: ${countAdolescentes}</span>
              <span class="text-blue-700">Jóv: ${countJovenes}</span>
              <span class="text-indigo-700">Adult: ${countAdultos}</span>
              <span class="text-purple-700 col-span-2">Ancianos (60+): ${countAncianos}</span>
            </div>

            <div class="p-2 space-y-2 max-h-48 overflow-y-auto">
        `;

        grupo.integrantes.forEach(ing => {
          const edadTxt = obtenerTextoEdadDetallada(ing.fn);
          const tel = ing.telefono ? ing.telefono.toString().trim() : '';

          popupContent += `
            <div class="bg-white p-2 rounded-lg border border-slate-200 shadow-sm text-[11px] space-y-1">
              <p class="font-bold text-blue-900 uppercase">${ing.nombreB || 'SIN NOMBRE'}</p>
              <p class="text-slate-600"><strong>DNI:</strong> ${ing.dni || '-'} | <strong>Edad:</strong> ${edadTxt}</p>
              <p class="text-slate-600"><strong>HC:</strong> ${ing.hclinica || '-'} | <strong>Tel:</strong> ${tel || '-'}</p>
          `;

          if (tel) {
            popupContent += `
              <div class="flex gap-1.5 pt-1">
                <a href="tel:${tel}" class="flex-1 bg-blue-600 text-white text-[10px] font-bold py-1 rounded text-center flex items-center justify-center gap-1 hover:bg-blue-700">
                  <i data-lucide="phone" class="w-3 h-3"></i> Llamar
                </a>
                <a href="https://wa.me/51${tel}" target="_blank" class="flex-1 bg-emerald-600 text-white text-[10px] font-bold py-1 rounded text-center flex items-center justify-center gap-1 hover:bg-emerald-700">
                  <i data-lucide="message-circle" class="w-3 h-3"></i> WhatsApp
                </a>
              </div>
            `;
          }

          popupContent += `</div>`;
        });

        popupContent += `</div></div>`;

        const marker = L.marker([grupo.lat, grupo.lng]).bindPopup(popupContent);
        marker.on('popupopen', () => lucide.createIcons());
        markersLayer.addLayer(marker);
      });

      if (drawnItems.getLayers().length > 0) {
        drawnItems.eachLayer(layer => {
          let labelText = "";
          if (layer instanceof L.Circle) {
            const radio = layer.getRadius();
            const radioTxt = radio >= 1000 ? `${(radio / 1000).toFixed(2)} km` : `${Math.round(radio)} m`;
            labelText = `📍 Radio: ${radioTxt} | 👥 Personas: ${totalPersonasEnFigura} (${totalPuntosEnFigura} familias)`;
          } else if (layer instanceof L.Polygon || layer instanceof L.Rectangle) {
            labelText = `📐 Zona seleccionada | 👥 Personas: ${totalPersonasEnFigura} (${totalPuntosEnFigura} familias)`;
          }

          if (labelText) {
            layer.unbindTooltip();
            layer.bindTooltip(labelText, {
              permanent: true,
              direction: 'top',
              className: 'draw-tooltip'
            }).openTooltip();
          }
        });
      }

      document.getElementById('badgeConteo').textContent = `${filtrados.length} Persona(s) (${bounds.length} Puntos)`;

      if (bounds.length > 0) {
        map.fitBounds(bounds, { padding: [50, 50], maxZoom: 17 });
      }
    }

    function actualizarEstadisticas(lista) {
      let ninos = 0, adolescentes = 0, jovenes = 0, adultos = 0, ancianos = 0;

      lista.forEach(item => {
        const edad = calcularEdad(item.fn);
        if (edad !== null) {
          if (edad < 12) ninos++;
          else if (edad <= 17) adolescentes++;
          else if (edad <= 29) jovenes++;
          else if (edad <= 59) adultos++;
          else ancianos++;
        }
      });

      document.getElementById('stat_total').textContent = `${lista.length} pers.`;
      document.getElementById('stat_ninos').textContent = ninos;
      document.getElementById('stat_adolescentes').textContent = adolescentes;
      document.getElementById('stat_jovenes').textContent = jovenes;
      document.getElementById('stat_adultos').textContent = adultos;
      document.getElementById('stat_ancianos').textContent = ancianos;
    }

    function limpiarFiltros() {
      document.getElementById('f_ffamiliar').value = "";
      document.getElementById('f_sector').value = "";
      sectoresSeleccionados.clear();
      document.getElementById('f_mz').value = "";
      document.getElementById('f_dni').value = "";
      document.getElementById('f_nombre').value = "";
      document.getElementById('f_fn_desde').value = "";
      document.getElementById('f_fn_hasta').value = "";
      document.getElementById('badgeEdadEquivalente').classList.add('hidden');
      filtroEtarioActivo = null;
      ['ninos', 'adolescentes', 'jovenes', 'adultos', 'ancianos'].forEach(b => {
        document.getElementById(`btn_etario_${b}`).classList.remove('ring-2', 'ring-blue-600', 'shadow-md', 'scale-[1.02]');
      });
      drawnItems.clearLayers();
      aplicarFiltros();
    }

    window.onload = initMap;
  </script>
</body>
