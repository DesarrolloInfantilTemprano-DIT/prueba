<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Censo DIT</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  <style>
    :root { 
      --primary-color: #00796b; 
      --secondary-color: #004d40; 
      --modal-header-color: #3f51b5; /* Azul similar a la imagen */
    }
    body { background-color: #f0f4f4; color: #333; }
    .header-panel { background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); color: white; padding: 25px; border-radius: 8px 8px 0 0; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .container { margin-top: 2%; max-width: 900px; }
    .card { border-radius: 12px; overflow: hidden; }
    .btn-save { background-color: var(--primary-color) !important; width: 100%; height: 50px; font-weight: bold; font-size: 1.1rem; }
    #loader { display: none; }
    .section-title { font-size: 0.9rem; font-weight: bold; color: var(--primary-color); text-transform: uppercase; margin-bottom: 20px; border-bottom: 2px solid #e0e0e0; padding-bottom: 5px; }
    input.validate.invalid { border-bottom: 1px solid #ff5252 !important; box-shadow: 0 1px 0 0 #ff5252 !important; }

    /* ESTILOS DEL MODAL DE SECTOR */
    #modalSector {
      border-radius: 12px;
      max-height: 85%;
      width: 90%;
      max-width: 550px;
    }
    .modal-header-custom {
      background-color: var(--modal-header-color);
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 1.1rem;
    }
    .modal-header-custom .modal-close {
      color: white;
      cursor: pointer;
      background: none;
      border: none;
    }
    .search-box-container {
      padding: 15px 20px 5px 20px;
    }
    .search-input-field {
      border: 2px solid #3f51b5 !important;
      border-radius: 20px !important;
      padding: 0 15px !important;
      box-sizing: border-box !important;
      height: 42px !important;
      font-size: 0.95rem !important;
      text-transform: uppercase;
    }
    .search-input-field:focus {
      box-shadow: 0 0 5px rgba(63, 81, 181, 0.5) !important;
    }
    .sector-list {
      max-height: 350px;
      overflow-y: auto;
      margin: 0;
      padding: 0 10px;
    }
    .sector-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 15px;
      border-bottom: 1px solid #e0e0e0;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      color: #333;
      transition: background 0.2s;
    }
    .sector-item:hover {
      background-color: #f1f3f9;
    }
    .sector-item i {
      color: #3f51b5;
      font-size: 1.1rem;
    }
    .modal-footer-custom {
      padding: 10px 20px;
      background-color: #f5f5f5;
      text-align: right;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card z-depth-3">
    <div class="header-panel center-align">
      <h4 style="margin:0;"><i class="material-icons medium">assignment_ind</i> CENSO DIT</h4>
      <p style="margin: 5px 0 0;">Bienvenido</p>
    </div>
    
    <div class="card-content">
      <form id="pacienteForm">
        <div class="row">
          <div class="input-field col s12 m8">
            <i class="material-icons prefix">fingerprint</i>
            <input id="dni" type="text" class="validate" required pattern="[0-9]{8}" maxlength="8">
            <label for="dni">DNI (Obligatorio - 8 dígitos)</label>
          </div>
          <div class="col s12 m4">
            <button type="button" class="btn waves-effect blue darken-3" onclick="buscarDNI()" style="width:100%; margin-top:15px;">
              <i class="material-icons left">search</i> Verificar
            </button>
          </div>
        </div>

        <div class="section-title">Datos Personales</div>
        <div class="row">
          <div class="input-field col s12">
            <i class="material-icons prefix">person</i>
            <input id="nombreB" type="text" class="validate" required style="text-transform: uppercase;">
            <label for="nombreB">Apellidos y Nombres Completos (Obligatorio)</label>
          </div>
        </div>

        <div class="row">
          <div class="input-field col s12 m4">
            <i class="material-icons prefix">event</i>
            <input id="fn" type="text" placeholder="DD/MM/YYYY" maxlength="10" required class="validate">
            <label for="fn" class="active">Fecha de Nacimiento (Obligatorio)</label>
          </div>
          <div class="input-field col s12 m4">
            <select id="sexo" required>
              <option value="" disabled selected>Sexo</option>
              <option value="M">Masculino</option>
              <option value="F">Femenino</option>
            </select>
            <label>Sexo (Obligatorio)</label>
          </div>
          <div class="input-field col s12 m4">
            <select id="estado_civil">
              <option value="" disabled selected>Estado Civil</option>
              <option value="SOLTERO">Soltero/a</option>
              <option value="CONVIVIENTE">Conviviente</option>
              <option value="CASADO">Casado/a</option>
              <option value="VIUDO">Viudo/a</option>
              <option value="DIVORCIADO">Divorciado/a</option>
              <option value="FALLECIDO">Fallecido/a</option>
            </select>
            <label>Estado Civil (Opcional)</label>
          </div>
        </div>

        <div class="section-title">Ubicación y Contacto</div>
        <div class="row">
          <div class="input-field col s12 m8">
            <i class="material-icons prefix">map</i>
            <!-- CAMPO DE SECTOR MEJORADO CON INTERFAZ TIPO MODAL -->
            <input id="sector" type="text" placeholder="Haga clic para seleccionar..." required class="validate" readonly onclick="abrirModalSector()">
            <label for="sector" class="active">Sector (Obligatorio)</label>
          </div>
          <div class="input-field col s12 m4">
            <input id="mz" type="text">
            <label for="mz">Manzana (Opcional)</label>
          </div>
        </div>

        <div class="row">
          <div class="input-field col s12 m6">
            <i class="material-icons prefix">phone</i>
            <input id="telefono" type="text" maxlength="9" pattern="[0-9]{9}" required class="validate">
            <label for="telefono">Celular 1 (9 dígitos)</label>
          </div>
          <div class="input-field col s12 m6">
            <i class="material-icons prefix">phone_android</i>
            <input id="telefono2" type="text" maxlength="9" pattern="[0-9]{9}" class="validate">
            <label for="telefono2">Celular 2 (Opcional - 9 dígitos)</label>
          </div>
        </div>

        <div class="row">
          <div class="input-field col s12">
            <i class="material-icons prefix">place</i>
            <input id="ref_direccion" type="text" required class="validate">
            <label for="ref_direccion">Referencia de Dirección (Obligatorio)</label>
          </div>
        </div>

        <div class="section-title">Historial</div>
        <div class="row">
          <div class="input-field col s12 m6">
            <i class="material-icons prefix">folder</i>
            <input id="hclinica" type="text" required class="validate">
            <label for="hclinica">Historia Clínica (Obligatorio)</label>
          </div>
          <div class="input-field col s12 m6">
            <i class="material-icons prefix">description</i>
            <input id="ffamiliar" type="text" maxlength="7" class="validate">
            <label for="ffamiliar">Ficha Familiar (Máx 7 números - Opcional)</label>
          </div>
        </div>

        <input type="hidden" id="rowNum" value="">
        <input type="hidden" id="georeferencia" value="">

        <div class="center-align">
          <button id="btnSubmit" class="btn waves-effect btn-save" type="submit">
            <i class="material-icons right">cloud_upload</i> Guardar
          </button>
        </div>

        <div id="loader" class="center-align" style="margin-top:20px;">
          <div class="preloader-wrapper small active">
            <div class="spinner-layer spinner-green-only">
              <div class="circle-clipper left"><div class="circle"></div></div>
              <div class="gap-patch"><div class="circle"></div></div>
              <div class="circle-clipper right"><div class="circle"></div></div>
            </div>
          </div>
          <p>Procesando información...</p>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- MODAL PARA SELECCIÓN DE SECTOR -->
<div id="modalSector" class="modal">
  <div class="modal-header-custom">
    <span><i class="material-icons left" style="font-size:1.2rem; vertical-align:middle;">location_on</i> Seleccionar Sector Registrado</span>
    <i class="material-icons modal-close">close</i>
  </div>
  <div class="search-box-container">
    <input type="text" id="inputBuscarSector" class="search-input-field" placeholder="ESCRIBA PARA SECTOR..." onkeyup="filtrarSectores()">
  </div>
  <div class="sector-list" id="listaSectoresContenedor">
    <!-- Lista generada dinámicamente mediante JS -->
  </div>
  <div class="modal-footer-custom">
    <a href="#!" class="modal-close btn-flat grey lighten-2 waves-effect" style="border-radius: 8px;">Cancelar</a>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
<script>
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzV4-amqK-0j0KkL5D1ukGwVOMdwdzVdlUd7hnaQT3RlBDM-61tTo6oAaiXn7kYtD4xZA/exec";
  const SCRIPT_ADMIN = "https://script.google.com/macros/s/AKfycbxmqviwzICjqWFCu9S5cx0Jb4Kp3Si9CcDLmEEALkgKH6VCAmzRJ66SLtPZaBjmbbqu/exec";

  let sectoresDisponibles = [];
  let modalSectorInstance = null;

  document.addEventListener('DOMContentLoaded', function() {
    M.AutoInit();

    // Inicializar Modal de Sector
    const modalElem = document.getElementById('modalSector');
    modalSectorInstance = M.Modal.init(modalElem, { dismissible: true });

    // Cargar sectores de forma dinámica desde ADMIN
    cargarSectoresDesdeAdmin();

    const fnInput = document.getElementById('fn');
    fnInput.addEventListener('input', function(e) {
      let v = e.target.value.replace(/\D/g, '').slice(0, 8);
      if (v.length >= 5) v = `${v.slice(0,2)}/${v.slice(2,4)}/${v.slice(4)}`;
      else if (v.length >= 3) v = `${v.slice(0,2)}/${v.slice(2)}`;
      e.target.value = v;
    });

    // Validación solo números para Manzana y Ficha Familiar
    ['mz', 'ffamiliar'].forEach(id => {
      document.getElementById(id).addEventListener('input', function(e) {
        this.value = this.value.replace(/[^0-9]/g, '');
      });
    });

    // Validación solo números (máximo 9 dígitos) para Celular 1 y Celular 2
    ['telefono', 'telefono2'].forEach(id => {
      document.getElementById(id).addEventListener('input', function(e) {
        this.value = this.value.replace(/[^0-9]/g, '').slice(0, 9);
      });
    });
  });

  // FUNCIÓN PARA CARGAR SECTORES DESDE SCRIPT_ADMIN
  async function cargarSectoresDesdeAdmin() {
    try {
      let response = await fetch(`${SCRIPT_ADMIN}?getSectores=true`);
      let data = await response.json();

      let listaObtenida = [];

      if (data && Array.isArray(data.sectores) && data.sectores.length > 0) {
        listaObtenida = data.sectores;
      } else if (Array.isArray(data) && data.length > 0) {
        listaObtenida = data;
      } else {
        response = await fetch(`${SCRIPT_ADMIN}?getColumnaAdmin=SECTORES`);
        data = await response.json();
        
        if (data && (data.data || data.profesionales)) {
          listaObtenida = data.data || data.profesionales;
        } else {
          response = await fetch(`${SCRIPT_ADMIN}?getColumnaAdmin=3`);
          data = await response.json();
          if (data && (data.data || data.profesionales)) {
            listaObtenida = data.data || data.profesionales;
          }
        }
      }

      sectoresDisponibles = listaObtenida
        .map(item => typeof item === 'object' ? (item.sector || item.SECTOR || Object.values(item)[0]) : item)
        .filter(sec => sec && sec.toString().trim() !== "");

      cargarSectores(sectoresDisponibles);
    } catch (error) {
      console.error("Error al cargar sectores desde SCRIPT_ADMIN:", error);
      M.toast({html: '⚠️ No se pudo obtener la lista de sectores'});
    }
  }

  // FUNCIONES PARA EL MODAL DE SECTOR
  function cargarSectores(lista) {
    const contenedor = document.getElementById('listaSectoresContenedor');
    contenedor.innerHTML = '';
    
    if (!lista || lista.length === 0) {
      contenedor.innerHTML = '<div style="padding: 20px; text-align: center; color: #888;">No se encontraron resultados o cargando...</div>';
      return;
    }

    lista.forEach(sec => {
      const item = document.createElement('div');
      item.className = 'sector-item';
      item.innerHTML = `<span>${sec}</span><i class="material-icons">chevron_right</i>`;
      item.onclick = function() {
        seleccionarSector(sec);
      };
      contenedor.appendChild(item);
    });
  }

  function abrirModalSector() {
    document.getElementById('inputBuscarSector').value = '';
    cargarSectores(sectoresDisponibles);
    modalSectorInstance.open();
    setTimeout(() => {
      document.getElementById('inputBuscarSector').focus();
    }, 300);
  }

  function filtrarSectores() {
    const texto = document.getElementById('inputBuscarSector').value.toUpperCase();
    const filtrados = sectoresDisponibles.filter(sec => String(sec).toUpperCase().includes(texto));
    cargarSectores(filtrados);
  }

  function seleccionarSector(valor) {
    document.getElementById('sector').value = valor;
    M.updateTextFields();
    modalSectorInstance.close();
  }

  async function buscarDNI() {
    const dni = document.getElementById('dni').value;
    if(dni.length < 8) return M.toast({html: '⚠️ DNI incompleto'});
    
    document.getElementById('loader').style.display = 'block';
    try {
      const response = await fetch(`${WEB_APP_URL}?action=buscar&dni=${dni}`);
      const data = await response.json();
      document.getElementById('loader').style.display = 'none';
      
      if(data && data.status === "ok") {
        document.getElementById('rowNum').value = data.row || "";
        document.getElementById('nombreB').value = data.nombreB || "";
        document.getElementById('fn').value = data.fn || "";
        document.getElementById('sexo').value = data.sexo || "";
        document.getElementById('hclinica').value = data.hclinica || "";
        document.getElementById('ffamiliar').value = data.ffamiliar || "";
        document.getElementById('telefono').value = data.telefono || "";
        // Mapea TELEFONO-2 o telefono2 de la respuesta del servidor
        document.getElementById('telefono2').value = data["TELEFONO-2"] || data.telefono2 || "";
        document.getElementById('estado_civil').value = data.estado_civil || "";
        document.getElementById('sector').value = data.sector || "";
        document.getElementById('ref_direccion').value = data.ref_direccion || "";
        document.getElementById('mz').value = data.mz || "";
        document.getElementById('georeferencia').value = data.georeferencia || data.gps || "";
        
        M.updateTextFields();
        
        var elems = document.querySelectorAll('select');
        M.FormSelect.init(elems);

        M.toast({html: '✅ Datos encontrados. Verifique y actualice.'});
      } else {
        M.toast({html: 'ℹ️ Usuario Nuevo. Registre todos los datos.'});
        
        document.getElementById('rowNum').value = "";
        const dniActual = document.getElementById('dni').value;
        document.getElementById('pacienteForm').reset();
        document.getElementById('dni').value = dniActual;
        document.getElementById('georeferencia').value = "";
        
        M.updateTextFields();
        var elems = document.querySelectorAll('select');
        M.FormSelect.init(elems);
      }
    } catch (error) {
      document.getElementById('loader').style.display = 'none';
      M.toast({html: '❌ Error al conectar con el servidor'});
      console.error(error);
    }
  }

  document.getElementById('pacienteForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const sectorInput = document.getElementById('sector').value.trim();
    if (sectoresDisponibles.length > 0 && !sectoresDisponibles.includes(sectorInput)) {
      M.toast({html: '❌ Por favor, seleccione un Sector válido de la lista.'});
      abrirModalSector();
      return;
    }

    const telVal = document.getElementById('telefono').value.trim();
    const telRegex = /^\d{9}$/;
    if (!telRegex.test(telVal)) {
      M.toast({html: '❌ El Celular 1 debe tener exactamente 9 dígitos'});
      document.getElementById('telefono').focus();
      return;
    }

    const tel2Val = document.getElementById('telefono2').value.trim();
    if (tel2Val && !telRegex.test(tel2Val)) {
      M.toast({html: '❌ El Celular 2 debe tener exactamente 9 dígitos si se completa'});
      document.getElementById('telefono2').focus();
      return;
    }

    if(!document.getElementById('sexo').value) {
        return M.toast({html: '⚠️ Seleccione el Sexo (Obligatorio)'});
    }

    document.getElementById('loader').style.display = 'block';
    document.getElementById('btnSubmit').disabled = true;

    // Se envían las propiedades exactas que espera tu Google Script
    const data = {
      row: document.getElementById('rowNum').value,
      dni: document.getElementById('dni').value,
      nombreB: document.getElementById('nombreB').value.toUpperCase(),
      fn: document.getElementById('fn').value,
      sexo: document.getElementById('sexo').value,
      hclinica: document.getElementById('hclinica').value,
      ffamiliar: document.getElementById('ffamiliar').value,
      telefono: telVal,
      telefono2: tel2Val,
      "TELEFONO-2": tel2Val, // Asegura compatibilidad con el título de la columna M del Excel
      estado_civil: document.getElementById('estado_civil').value,
      sector: sectorInput,
      ref_direccion: document.getElementById('ref_direccion').value,
      mz: document.getElementById('mz').value,
      georeferencia: document.getElementById('georeferencia').value
    };

    try {
      await fetch(WEB_APP_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: JSON.stringify(data)
      });

      document.getElementById('loader').style.display = 'none';
      document.getElementById('btnSubmit').disabled = false;
      M.toast({html: '🚀 Guardado con éxito en el Censo'});
      
      this.reset();
      document.getElementById('rowNum').value = "";
      document.getElementById('georeferencia').value = "";
      M.updateTextFields();
      var elems = document.querySelectorAll('select');
      M.FormSelect.init(elems);
    } catch (error) {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('btnSubmit').disabled = false;
      M.toast({html: '❌ Fallo al guardar los datos'});
    }
  });
</script>
</body>
</html>
